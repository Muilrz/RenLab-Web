<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab Tour · Ren Research Group</title>
  <meta name="description" content="Laboratory facilities and instruments of the Ren Research Group, Xiamen University.">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="lab">
  <header id="site-header" class="site-header is-transparent"></header>

  <main>
    <section class="page-hero">
      <div class="hero-grid"></div>
      <div class="page-hero-spec"></div>
      <div class="container">
        <div class="crumbs"><a href="index.html">Home</a><span>/</span><span>Lab Tour</span></div>
        <h1>Lab Tour</h1>
        <p>A tour of our laboratories and the Raman, TERS and electrochemical instruments we build and use.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head reveal"><div><div class="eyebrow">Lab tour</div><h2>Our laboratory</h2></div></div>
        <div class="mosaic reveal" id="lab-photos"></div>
      </div>
    </section>

    <section class="section section-alt">
      <div class="container">
        <div class="section-head reveal"><div><div class="eyebrow">Facilities</div><h2>Instruments</h2><p>Commercial and home-built Raman, TERS and electrochemical platforms available in the group.</p></div></div>
        <div id="instruments"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="assets/data/lab.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var S = window.Site, esc = S.esc, D = window.SITE_DATA || {};
      var lab = D.lab || { photos: [], instruments: [] };

      document.getElementById("lab-photos").innerHTML = lab.photos.map(function (src, i) {
        return '<figure data-zoom><img src="' + esc(src) + '" alt="Laboratory photo ' + (i + 1) + '" loading="lazy"></figure>';
      }).join("");

      var groups = [], byG = {};
      lab.instruments.forEach(function (x) { if (!byG[x.group]) { byG[x.group] = []; groups.push(x.group); } byG[x.group].push(x); });
      var titles = { Raman: "Raman instruments", TERS: "TERS instruments", Others: "Other facilities" };
      document.getElementById("instruments").innerHTML = groups.map(function (g) {
        return '<div class="inst-group reveal"><h3><span class="tag">' + esc(g) + "</span>" + esc(titles[g] || g) + '</h3><div class="inst-grid">' +
          byG[g].map(function (x) {
            return '<figure class="inst"><div class="inst-img" data-zoom><img src="' + esc(x.img) + '" alt="' + esc(x.name) + '" loading="lazy"></div><figcaption>' + esc(x.name) + "</figcaption></figure>";
          }).join("") + "</div></div>";
      }).join("");
      S.initReveal();
    });
  </script>
</body>
</html>
